<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top, #1a1a2e, #0b0b12);
  font-family: Arial, sans-serif;
  color: #f4f4f4;
  overflow: hidden;
}

.glow {
  position: absolute;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(180,120,255,0.2), transparent 60%);
  filter: blur(40px);
  animation: float 6s ease-in-out infinite;
}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-20px); }
  100% { transform: translateY(0px); }
}

.card {
  position: relative;
  background: rgba(20, 20, 35, 0.7);
  border: 1px solid rgba(180, 120, 255, 0.25);
  backdrop-filter: blur(10px);
  border-radius: 18px;
  padding: 28px;
  width: 90%;
  max-width: 420px;
  box-shadow: 0 0 40px rgba(180, 120, 255, 0.15);
}

h1 {
  margin: 0;
  font-size: 26px;
  text-align: center;
}

.sub {
  text-align: center;
  color: #b48cff;
  margin-top: 6px;
  margin-bottom: 20px;
  font-size: 14px;
}

.section {
  margin-top: 16px;
}

.title {
  font-size: 14px;
  color: #b48cff;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.text {
  font-size: 14px;
  opacity: 0.9;
  line-height: 1.4;
}

.badges {
  margin-top: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.badge {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(180,120,255,0.2);
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 12px;
}

.footer {
  margin-top: 18px;
  text-align: center;
  font-size: 11px;
  opacity: 0.5;
}
</style>

</head>

<body>

<div class="glow"></div>

<div class="card">
